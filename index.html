<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef0f2">
<title>鎷惧厜 les 茅clats 路 鐧介浘缁煎悎鐗?/title>
<style>
:root{
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --ink:#5a5f66; --dim:#8b9096; --faint:#b3b8be; --hairline:rgba(90,95,102,.14);
  --card:rgba(255,255,255,.62); --card2:rgba(255,255,255,.85);
  --stroke:rgba(255,255,255,.9); --stroke-soft:rgba(255,255,255,.55);
  --shadow:0 10px 30px rgba(120,128,138,.14); --shadow-lg:0 20px 55px rgba(110,118,128,.18);
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  --spring:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#eef0f2;color:var(--ink);font-family:var(--serif);font-weight:300;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
/* 鐧介浘搴?+ 姘涘洿 */
#photo{position:fixed;inset:0;z-index:-3;background:
  radial-gradient(ellipse at 18% 8%,rgba(255,255,255,.9),transparent 45%),
  radial-gradient(ellipse at 85% 78%,rgba(255,255,255,.85),transparent 40%),
  linear-gradient(165deg,#f4f5f6 0%,#e8eaec 50%,#dfe2e5 100%);transition:background .6s}
.mist{position:fixed;width:130vw;height:34vh;left:-15vw;top:30%;z-index:-2;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);filter:blur(30px);
  animation:mistfx 18s ease-in-out infinite alternate}
.rain-fx{position:fixed;inset:-20%;z-index:-2;pointer-events:none;opacity:0;transition:opacity .4s;
  background-image:linear-gradient(110deg,transparent 0 48%,rgba(160,168,178,.4) 49%,transparent 50%);
  background-size:27px 54px;animation:rain .65s linear infinite}
.snow-fx{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:0;transition:opacity .4s;
  background-image:radial-gradient(circle,rgba(255,255,255,.95) 1.4px,transparent 2.4px),radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 2px);
  background-size:72px 90px,120px 130px;background-position:0 0,40px 60px;animation:snow 12s linear infinite}
@keyframes rain{to{transform:translateY(54px)}}
@keyframes snow{to{background-position:0 400px,40px 460px}}
@keyframes mistfx{to{transform:translateX(16vw) translateY(4vh)}}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:20px;
  box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1)}
.en-i{font-style:italic;font-family:Georgia,"Times New Roman",serif;color:var(--faint);letter-spacing:1px}
.lbl{font-family:var(--sans);font-size:10px;letter-spacing:2px;color:var(--faint)}
.app{position:relative;z-index:2;max-width:760px;margin:0 auto;
  padding:calc(14px + var(--safe-t)) 16px calc(40px + var(--safe-b))}
/* 椤舵爮 */
.status{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 10px;
  font-family:var(--sans);font-size:12px;font-weight:600;color:#5d646b}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.topbar .back{width:30px;height:30px;border:none;background:none;font-size:18px;color:var(--dim)}
.brand{font-size:15px;letter-spacing:1px;color:var(--dim)}
.brand em{font-style:italic;color:var(--faint);font-size:12px;margin-left:6px}
.ticons{display:flex;gap:10px}
.tbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--stroke);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--dim);box-shadow:var(--shadow)}
/* 鍏磋叮鏍囩 */
.chips-row{padding:14px 16px;margin-bottom:16px}
.chips-head{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.chips-head b{font-size:15px;font-weight:400;letter-spacing:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--hairline);border-radius:99px;padding:6px 13px;font-size:11.5px;
  color:var(--dim);background:rgba(255,255,255,.4);transition:.2s}
.chip.on{background:#5a5f66;color:#fff;border-color:#5a5f66}
/* SALLE 浠婃棩澶у崱 */
.salle-head{text-align:center;margin:8px 0 12px;color:var(--faint);font-size:12px;letter-spacing:4px}
.salle-head .l{display:inline-block;width:52px;height:1px;background:var(--hairline);vertical-align:middle;margin:0 12px}
.salle{padding:20px 18px 16px;position:relative;overflow:hidden}
.salle .arrange{position:absolute;right:16px;top:18px;font-size:11px;color:var(--faint);border:none;background:none}
.salle-top{display:flex;gap:18px;align-items:flex-start}
.pol-stack{position:relative;width:118px;height:140px;flex:none}
.pol{position:absolute;width:96px;height:118px;background:#fff;border-radius:6px;padding:6px 6px 18px;
  box-shadow:0 8px 22px rgba(110,118,128,.22);background-size:cover;background-position:center}
.pol.p1{left:0;top:0;transform:rotate(-4deg);z-index:2}
.pol.p2{left:16px;top:8px;transform:rotate(5deg);z-index:1;opacity:.85}
.datebox{padding-top:6px}
.datebox .auj{font-style:italic;font-family:Georgia,serif;color:var(--faint);font-size:15px;letter-spacing:1px}
.datebox .dnum{font-size:42px;line-height:1;font-weight:300;color:#4a4f55;margin-top:2px}
.datebox .dsub{font-size:11.5px;color:var(--dim);margin-top:8px;letter-spacing:2px}
.admin .dnum,.admin .dsub{border-bottom:1px dashed var(--hairline);cursor:pointer}
.salle-quote{margin:18px 2px 4px;font-size:17px;line-height:1.6;color:#4a4f55;font-family:Georgia,"Songti SC",serif}
.salle-quote small{display:block;font-size:10.5px;color:var(--faint);margin-top:7px;letter-spacing:.5px}
.salle-meta{font-size:11px;color:var(--dim);margin:10px 2px 0;letter-spacing:1px}
.salle-meta b{font-weight:400;cursor:pointer;border-bottom:1px dashed var(--hairline)}
/* 14 澶╂棩鍘?*/
.cal{margin-top:16px;border-top:1px solid var(--stroke-soft);padding-top:12px}
.cal-head{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-bottom:8px;letter-spacing:1px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .c{font-size:11px;color:var(--dim);padding:6px 0;border-radius:9px;cursor:pointer;position:relative}
.cal-grid .c i{display:block;font-style:normal;font-size:7px;color:var(--faint);margin-bottom:1px}
.cal-grid .c.today{background:#5a5f66;color:#fff}
.cal-grid .c.has:after{content:"路";position:absolute;bottom:0;left:50%;transform:translateX(-50%);color:#9aa0a7}
.cal-grid .c.today:after{color:#fff}
/* 鐢?澶╂枃/鐗?琛?*/
.day-rows{margin-top:14px;border-top:1px solid var(--stroke-soft);padding:12px 2px 2px;font-size:12px;line-height:2.1;color:var(--dim)}
.day-rows b{font-weight:400;color:var(--ink)}
.day-rows em{font-style:italic;color:var(--faint)}
/* 瀛樻。鏉?*/
.archive{display:flex;justify-content:center;gap:10px;align-items:center;margin:18px 0 6px;font-size:11px;color:var(--faint);letter-spacing:2px}
.archive .l{width:60px;height:1px;background:var(--hairline)}
/* 妯″潡鍗★紙鍥炲舰閽堝崱锛?*/
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.mod-card{padding:14px;min-height:150px;display:flex;flex-direction:column;position:relative;cursor:pointer;
  transition:transform .25s var(--spring)}
.mod-card:active{transform:scale(.97)}
.clip{position:absolute;top:10px;right:12px;font-size:15px;color:var(--faint);transform:rotate(15deg)}
.mod-card .vert{writing-mode:vertical-rl;text-orientation:upright;font-size:12.5px;letter-spacing:3px;color:var(--dim);
  max-height:96px;overflow:hidden;margin-bottom:auto}
.mod-card .thumb{height:74px;border-radius:10px;background-size:cover;background-position:center;
  background-color:rgba(0,0,0,.05);margin-bottom:auto}
.mod-card .mname{font-size:16px;margin-top:10px;letter-spacing:1px}
.mod-card .mname em{font-size:10px;margin-left:6px}
.mod-card .msub{font-family:var(--sans);font-size:10px;color:var(--faint);margin-top:4px}
/* 璇︽儏瑙嗗浘 */
.detail{margin-top:14px}
.pane{padding:18px;margin-bottom:14px}
.mhead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.mhead h2{font-size:18px;font-weight:300;margin:0;letter-spacing:1px}
.ed{width:100%;min-height:110px;background:rgba(255,255,255,.5);border:1px solid var(--hairline);border-radius:14px;
  color:var(--ink);font-family:var(--serif);font-size:14px;line-height:1.9;padding:12px 14px;resize:vertical;outline:none}
.ed::placeholder{color:var(--faint)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.gal .it{aspect-ratio:1;border-radius:11px;overflow:hidden;background:rgba(0,0,0,.05)}
.gal .it img{width:100%;height:100%;object-fit:cover;display:block}
.gal .addb{display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--faint);
  border:1px dashed var(--hairline);border-radius:11px;background:none;aspect-ratio:1}
.cols{display:flex;flex-direction:column;gap:12px}
.col{display:flex;gap:14px;padding:13px;align-items:stretch}
.col:nth-child(even){flex-direction:row-reverse}
.bimg{flex:0 0 34%;min-height:110px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.05);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.bimg img{width:100%;height:100%;object-fit:cover;display:block}
.bimg .ph{font-family:var(--sans);font-size:10px;color:var(--faint)}
.btxt{flex:1;display:flex;flex-direction:column}
.btxt textarea{flex:1;min-height:80px;background:rgba(255,255,255,.5);border:1px solid var(--hairline);border-radius:12px;
  color:var(--ink);font-family:var(--serif);font-size:13px;line-height:1.8;padding:10px 12px;resize:vertical;outline:none}
.colbar{display:flex;gap:7px;margin-top:8px}
.mini{border:1px solid var(--hairline);background:rgba(255,255,255,.5);color:var(--dim);border-radius:11px;
  font-family:var(--sans);font-size:10.5px;padding:5px 10px}
.mini:hover{background:#fff;color:var(--ink)}
.add{width:100%;margin-top:12px;border:1px dashed var(--hairline);border-radius:14px;background:none;
  color:var(--dim);font-family:var(--sans);font-size:11.5px;letter-spacing:1.4px;padding:11px}
.add:hover{background:rgba(255,255,255,.6)}
/* 澶╂皵 / 闊充箰 / 鑱婂ぉ */
.wchip{border:1px solid var(--stroke);border-radius:16px;padding:12px 16px;text-align:center;background:var(--card2);min-width:88px}
.wicon{font-size:24px;display:block}
.wtemp{font-family:Georgia,serif;font-size:20px;margin-top:3px}
.wsmall{font-size:10px;color:var(--faint);margin-top:3px}
.wdetail{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.wdetail div{padding:10px 13px;border-radius:12px;background:rgba(255,255,255,.5);font-size:11px;color:var(--faint)}
.wdetail b{display:block;color:var(--ink);font-size:14px;font-weight:300;margin-top:4px}
.wopts{display:flex;gap:7px;flex-wrap:wrap}
.wopts button{border:1px solid var(--hairline);border-radius:99px;padding:7px 13px;background:rgba(255,255,255,.5);
  font-size:12px;color:var(--dim)}
.wopts button.on{background:#5a5f66;color:#fff;border-color:#5a5f66}
.music{display:flex;align-items:center;gap:12px;margin-top:6px}
.album{width:62px;height:62px;border-radius:14px;background:linear-gradient(135deg,#dfe2e6,#f4f5f6);
  display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--faint)}
.music-info{flex:1;min-width:0}
.music-info b{font-size:14px;font-weight:300;display:block}
.music-info small{font-family:var(--sans);font-size:10px;color:var(--faint);display:block;margin-top:4px}
.progress{height:3px;background:rgba(90,95,102,.14);border-radius:4px;margin-top:9px;overflow:hidden}
.progress span{display:block;width:0;height:100%;background:#5a5f66;transition:width .2s}
.mctl{display:flex;gap:8px;margin-top:9px}
.round{width:29px;height:29px;border:1px solid var(--hairline);border-radius:50%;background:rgba(255,255,255,.6);font-size:11px}
.round.play{width:36px;height:36px;font-size:14px;background:#fff}
.chat-log{display:flex;flex-direction:column;gap:9px;min-height:140px;max-height:38vh;overflow-y:auto;padding:4px 0}
.bubble{max-width:84%;padding:10px 13px;border-radius:15px;background:rgba(255,255,255,.75);font-size:13px;line-height:1.7;align-self:flex-start}
.bubble.me{align-self:flex-end;background:#e3e6ea}
.choices{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
/* 闊充箰鎻掑潡锛堝浘涓€鎺掔増 + 鍥句簩鍞辩墖锛?*/
.mblock{padding:18px 0 16px;margin-top:16px;overflow:hidden}
.cf{position:relative;height:150px;display:flex;align-items:center;justify-content:center;margin-top:6px}
.cf-card{position:absolute;width:104px;height:104px;border-radius:14px;background:#fff;
  box-shadow:0 10px 26px rgba(110,118,128,.2);transition:all .45s var(--spring);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.cf-card .sq{width:100%;height:100%;background-size:cover;background-position:center;background-color:#e7e9ec}
.cf-card.side{opacity:.55;filter:blur(1px) saturate(.6)}
.cf-card.far{opacity:.3;filter:blur(2px) saturate(.5)}
/* 鐧借兌鍞辩墖锛堝浘浜屾牱寮忥級 */
.disc{position:relative;width:88px;height:88px;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%,#fafafa 0 1.6px,#eceef0 1.6px 3.2px);
  box-shadow:inset 0 0 0 1px rgba(120,128,138,.14),0 4px 14px rgba(110,118,128,.18)}
.disc .staff{position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(90,95,102,.3)}
.disc .staff.s2{inset:12px;border-color:rgba(90,95,102,.22)}
.disc .staff.s3{inset:16px;border-color:rgba(90,95,102,.14)}
.disc .note{position:absolute;font-size:9px;color:#5a5f66;opacity:.75}
.disc .label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;
  background:#fff center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(120,128,138,.2);overflow:hidden}
.disc .label .hole{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;
  background:#eef0f2;box-shadow:inset 0 1px 3px rgba(110,118,128,.35)}
.disc .ring-txt{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-family:Georgia,serif;
  font-style:italic;font-size:5.5px;letter-spacing:.6px;color:#8b9096;white-space:nowrap}
@keyframes spin{to{transform:rotate(360deg)}}
.cf-card.center .disc.spin{animation:spin 6s linear infinite}
.cf-card.center{width:118px;height:118px;z-index:3}
.cf-card.center .disc{width:104px;height:104px}
.cf-card{cursor:pointer}
/* 姝屽悕鑳跺泭 + 姝岃瘝 + 鎺у埗鏉?*/
.np-pill{display:inline-flex;flex-direction:column;align-items:center;background:#fff;border:1px solid var(--stroke);
  border-radius:16px;padding:8px 22px;box-shadow:var(--shadow);margin:10px auto 0}
.np-pill b{font-size:13.5px;font-weight:400;letter-spacing:1px}
.np-pill small{font-family:Georgia,serif;font-style:italic;font-size:10px;color:var(--faint);margin-top:2px}
.np-wrap{text-align:center}
.lyr{margin-top:10px;font-size:11.5px;line-height:2;color:var(--dim);letter-spacing:1px}
.lyr b{font-weight:400;color:#4a4f55}
.ctlbar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--stroke);border-radius:99px;
  padding:9px 14px;margin:14px 8px 0;box-shadow:var(--shadow)}
.ctlbar .cbtn{border:none;background:none;font-size:14px;color:#4a4f55;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center}
.ctlbar .cbtn:active{background:#f0f1f3}
.ctlbar .prog{flex:1;height:4px;border-radius:4px;background:rgba(90,95,102,.14);overflow:hidden;cursor:pointer}
.ctlbar .prog span{display:block;width:0;height:100%;background:#5a5f66;transition:width .2s}
.ctlbar .heart.on{color:#d98a94}
.ctlbar .up{width:30px;height:30px;border-radius:50%;border:1px dashed var(--hairline);background:none;color:var(--faint);font-size:13px}
/* 鎿﹂浘寮€灞忥紙绗竴鐗堢壒鏁堬級 */
#splash{position:fixed;inset:0;z-index:80;transition:opacity .9s ease,transform .9s ease}
#splash.gone{opacity:0;transform:scale(1.04);pointer-events:none}
#fog{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#ripple{position:fixed;inset:0;z-index:1;pointer-events:none}
.ui{position:absolute;inset:0;pointer-events:none;color:#5a5f66}
.ui .intro{position:absolute;left:max(8.2%,26px);top:calc(var(--safe-t) + 30px);z-index:3}
.ui .en{font-family:var(--sans);font-weight:300;font-size:10px;letter-spacing:2.1px;line-height:1.8;color:#8b9096}
.ui .cn{margin-top:9px;font-size:11px;letter-spacing:.7px;line-height:1.8;color:#6b7077}
.ui .mt{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:64px;letter-spacing:2px;
  color:#4a4f55;text-shadow:0 1px 12px rgba(255,255,255,.9);opacity:.92}
.ui .mt.mt-small{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:19px;letter-spacing:1.5px;
  color:#6b7077;text-shadow:0 1px 10px rgba(255,255,255,.9);max-width:78%;text-align:center;line-height:1.6}
.ui .enter{position:absolute;right:max(6.5%,22px);bottom:max(24px,calc(var(--safe-b) + 14px));pointer-events:auto;
  min-width:62px;min-height:48px;padding:6px 12px;border:1px solid rgba(90,95,102,.35);background:rgba(255,255,255,.5);
  color:#5a5f66;font-family:var(--sans);font-size:10px;letter-spacing:2.1px;border-radius:24px;cursor:pointer;
  opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;backdrop-filter:blur(6px);z-index:4}
.ui .enter.show{opacity:1;transform:none}
.ui .hint{position:absolute;left:50%;bottom:calc(30px + var(--safe-b));transform:translateX(-50%);font-size:11px;
  letter-spacing:2.6px;color:#8b9096}
.ui .bar{position:absolute;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);width:110px;height:2px;
  background:rgba(90,95,102,.16);border-radius:2px;overflow:hidden}
.ui .bar i{display:block;height:100%;width:0;background:#8b9096;transition:width .25s}
/* 鎷嶇珛寰楀璇濋〉锛堝浘浜屾帓鐗堬級 */
#dlg{position:fixed;inset:0;z-index:75;display:none;overflow:hidden;background:#dfe3e6}
#dlg.on{display:block;animation:fade .4s var(--spring) both}
#dlgBg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(.7) brightness(1.02)}
#dlgBg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 30%,rgba(255,255,255,.28) 100%)}
.dlg-top{position:absolute;top:calc(12px + var(--safe-t));left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;z-index:3}
.dlg-btn{min-width:34px;height:34px;border-radius:99px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.55);
  color:#5a5f66;font-size:13px;padding:0 12px;backdrop-filter:blur(10px)}
.dlg-bars{position:absolute;left:8%;right:22%;top:26%;z-index:2;display:flex;flex-direction:column;gap:14px}
.dbar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.82);padding:12px 16px;
  box-shadow:0 6px 18px rgba(110,118,128,.14);font-size:13.5px;color:#4a4f55;letter-spacing:.5px;cursor:default;transition:.2s}
.dbar .dot{width:4px;height:4px;border-radius:50%;background:#8b9096;margin-left:auto;flex:none}

/* 鎿﹂浘寮€灞?+ 姘存尝锛堢涓€鐗堢壒鏁堬級 */
const fog=$('fog'),fx=fog.getContext('2d');
const rip=$('ripple'),rx=rip.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2),noise=null;
function makeNoise(){
 const n=document.createElement('canvas');n.width=n.height=140;
 const c=n.getContext('2d'),im=c.createImageData(140,140),d=im.data;
 for(let i=0;i<d.length;i+=4){const v=205+Math.random()*50;d[i]=d[i+1]=d[i+2]=v;d[i+3]=Math.random()*34;}
 c.putImageData(im,0,0);return n;}
function paintFog(){
 fx.setTransform(DPR,0,0,DPR,0,0);fx.globalCompositeOperation='source-over';fx.clearRect(0,0,W,H);
 const g=fx.createLinearGradient(0,0,W,H);
 g.addColorStop(0,'rgba(250,251,252,.97)');g.addColorStop(.55,'rgba(238,240,243,.95)');g.addColorStop(1,'rgba(226,229,233,.96)');
 fx.fillStyle=g;fx.fillRect(0,0,W,H);
 const n=Math.max(14,Math.round(W*H/(250*250)));
 for(let i=0;i<n;i++){
  const x=Math.random()*W,y=Math.random()*H,r=110+Math.random()*320,a=.06+Math.random()*.14;
  const rg=fx.createRadialGradient(x,y,0,x,y,r);
  rg.addColorStop(0,`rgba(255,255,255,${a})`);rg.addColorStop(.6,`rgba(240,243,246,${a*.5})`);rg.addColorStop(1,'rgba(255,255,255,0)');
  fx.fillStyle=rg;fx.beginPath();fx.arc(x,y,r,0,7);fx.fill();}
 if(!noise)noise=makeNoise();
 fx.globalAlpha=.5;fx.fillStyle=fx.createPattern(noise,'repeat');fx.fillRect(0,0,W,H);fx.globalAlpha=1;}
function resizeAll(){
 W=window.innerWidth;H=window.innerHeight;
 [[fog,fx],[rip,rx]].forEach(([c,gg])=>{c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';gg.setTransform(DPR,0,0,DPR,0,0);});
 paintFog();}
window.addEventListener('resize',()=>{clearTimeout(window.__rt);window.__rt=setTimeout(resizeAll,180);});
resizeAll();
let erasing=false,last=null,auto=false;
const RAD=()=>Math.round(38+window.innerWidth/22);
function wipe(x,y,r){
 fx.save();fx.globalCompositeOperation='destination-out';
 const g=fx.createRadialGradient(x,y,0,x,y,r);
 g.addColorStop(0,'rgba(0,0,0,.95)');g.addColorStop(.55,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');
 fx.fillStyle=g;fx.beginPath();fx.arc(x,y,r,0,7);fx.fill();fx.restore();}
function pt(e){const r=fog.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
fog.addEventListener('pointerdown',e=>{erasing=true;last=pt(e);wipe(last.x,last.y,RAD());spawn(last.x,last.y);fog.setPointerCapture&&fog.setPointerCapture(e.pointerId);});
fog.addEventListener('pointermove',e=>{if(!erasing)return;const p=pt(e);
 if(last){const dx=p.x-last.x,dy=p.y-last.y,dist=Math.hypot(dx,dy),n=Math.max(1,Math.min(40,Math.round(dist/14)));
  for(let i=1;i<=n;i++)wipe(last.x+dx*i/n,last.y+dy*i/n,RAD()*.88);}else wipe(p.x,p.y,RAD()*.88);
 last=p;if(Math.random()<.22)spawn(p.x,p.y);queue();},{passive:true});
['pointerup','pointercancel','pointerleave'].forEach(ev=>fog.addEventListener(ev,()=>{erasing=false;last=null;queue();}));
let rips=[];
function spawn(x,y){rips.push({x,y,t0:performance.now(),r0:6+Math.random()*8});if(rips.length>26)rips.shift();}
document.addEventListener('pointermove',e=>{if($('splash').classList.contains('gone')&&Math.random()<.12)spawn(e.clientX,e.clientY);},{passive:true});
(function loop(){
 rx.clearRect(0,0,W,H);const now=performance.now();
 rips=rips.filter(r=>now-r.t0<1600);
 rips.forEach(r=>{
  const t=(now-r.t0)/1600,base=r.r0+t*160,a=(1-t)*.22;
  rx.strokeStyle=`rgba(150,160,170,${a})`;rx.lineWidth=1.5;
  for(let k=0;k<2;k++){rx.beginPath();const rr=base-k*22;
   for(let ang=0;ang<=360;ang+=6){const rad=ang*Math.PI/180;
    const wob=Math.sin(rad*3+now/220+k*1.7)*4*(1-t);
    const x=r.x+Math.cos(rad)*(rr+wob),y=r.y+Math.sin(rad)*(rr+wob)*.86;
    ang===0?rx.moveTo(x,y):rx.lineTo(x,y);}
   rx.closePath();rx.stroke();}});
 requestAnimationFrame(loop);})();
let busy=false,erased=0;
function queue(){if(busy)return;busy=true;setTimeout(()=>{busy=false;progress();},110);}
function progress(){
 const step=36;let clear=0,total=0;
 try{for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){
  const d=fx.getImageData(Math.round(x*DPR),Math.round(y*DPR),1,1).data;total++;if(d[3]<40)clear++;}}
 catch(e){return;}
 erased=total?clear/total:0;
 $('barIn').style.width=Math.min(100,Math.round(erased/.30*100))+'%';
 if(erased>.10)$('enter').classList.add('show');
 if(erased>=.30&&!auto){auto=true;$('enter').classList.add('show');setTimeout(enterApp,500);}}
function enterApp(){$('splash').classList.add('gone');}
$('enter').onclick=enterApp;
$('againBtn').onclick=()=>{auto=false;erased=0;rips.length=0;$('barIn').style.width='0%';
 $('enter').classList.remove('show');paintFog();$('splash').classList.remove('gone');};
fog.addEventListener('click',()=>{if(erased<=.10)$('enter').classList.add('show');});
